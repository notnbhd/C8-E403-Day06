<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym AI Chatbot</title>
  <meta name="description" content="Hỏi đáp thông minh về tập gym dựa trên tài liệu nghiên cứu khoa học" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0f14;
      --surface:     #161b27;
      --surface2:    #1e2535;
      --border:      #2a3348;
      --accent:      #4f8ef7;
      --accent2:     #7c5cfc;
      --accent-glow: rgba(79,142,247,.25);
      --text:        #e2e8f0;
      --text-muted:  #64748b;
      --user-bg:     linear-gradient(135deg,#4f8ef7,#7c5cfc);
      --bot-bg:      #1e2535;
      --green:       #22d3a0;
      --radius:      16px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      backdrop-filter: blur(10px);
    }
    .logo {
      width: 40px; height: 40px;
      background: var(--user-bg);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .header-info h1 { font-size: 16px; font-weight: 600; }
    .header-info p  { font-size: 12px; color: var(--text-muted); }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      margin-left: auto;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: .4; }
    }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Welcome ── */
    .welcome {
      text-align: center;
      padding: 40px 20px;
      animation: fadeUp .5s ease;
    }
    .welcome .icon { font-size: 56px; margin-bottom: 16px; }
    .welcome h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .welcome p  { color: var(--text-muted); font-size: 14px; max-width: 400px; margin: 0 auto 24px; }
    .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    }
    .suggestion-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all .2s;
    }
    .suggestion-btn:hover {
      border-color: var(--accent);
      background: rgba(79,142,247,.1);
      color: var(--accent);
    }

    /* ── Message rows ── */
    .msg-row { display: flex; gap: 10px; animation: fadeUp .3s ease; max-width: 820px; margin: 0 auto; width: 100%; }
    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .msg-row.bot  .avatar { background: var(--surface2); border: 1px solid var(--border); }
    .msg-row.user .avatar { background: var(--user-bg); }

    .bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
    }
    .msg-row.user .bubble {
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
      color: #fff;
    }
    .msg-row.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    /* ── Sources ── */
    .sources-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      background: transparent;
      transition: all .2s;
    }
    .sources-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .sources-panel {
      display: none;
      margin-top: 8px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .sources-panel.open { display: flex; }
    .source-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .source-card .page-badge {
      display: inline-block;
      background: rgba(79,142,247,.15);
      color: var(--accent);
      border-radius: 6px;
      padding: 2px 7px;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 11px;
    }
    .source-card .sim-bar {
      height: 3px;
      background: var(--border);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .source-card .sim-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 3px;
      transition: width .6s ease;
    }

    /* ── Typing indicator ── */
    .typing { display: flex; gap: 5px; align-items: center; padding: 6px 0; }
    .typing span {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce .9s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s;  }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    /* ── Input bar ── */
    .input-bar {
      padding: 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-wrap {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      transition: border-color .2s;
    }
    .input-wrap:focus-within { border-color: var(--accent); }
    #question {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }
    #question::placeholder { color: var(--text-muted); }
    #send-btn {
      width: 36px; height: 36px;
      background: var(--user-bg);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform .15s, opacity .15s;
      font-size: 16px;
    }
    #send-btn:hover  { transform: scale(1.08); }
    #send-btn:active { transform: scale(.95);  }
    #send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .hint { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 8px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">💪</div>
  <div class="header-info">
    <h1>Gym AI Chatbot</h1>
    <p>Hỏi đáp tài liệu nghiên cứu tập gym</p>
  </div>
  <div class="status-dot" id="status-dot" title="Đang kết nối..."></div>
</header>

<!-- Chat -->
<div id="chat">
  <div class="welcome" id="welcome">
    <div class="icon">🏋️</div>
    <h2>Chào mừng đến với Gym AI!</h2>
    <p>Tôi được huấn luyện từ tài liệu nghiên cứu khoa học về tập gym. Hãy hỏi bất kỳ điều gì!</p>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="sendSuggestion(this)">Bài tập nào tốt cho cơ ngực?</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">Chế độ dinh dưỡng khi tập gym?</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">Thời gian nghỉ giữa các set?</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">Tần suất tập luyện mỗi tuần?</button>
    </div>
  </div>
</div>

<!-- Input -->
<div class="input-bar">
  <div class="input-wrap">
    <textarea id="question" placeholder="Nhập câu hỏi về tập gym..." rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Gửi">➤</button>
  </div>
  <p class="hint">Enter để gửi • Shift+Enter xuống dòng</p>
</div>

<script>
  const chatEl   = document.getElementById('chat');
  const inputEl  = document.getElementById('question');
  const sendBtn  = document.getElementById('send-btn');
  const statusDot = document.getElementById('status-dot');

  let history = [];   // [{role, content}]
  let isLoading = false;

  // ── Health check ──────────────────────────────────────────────────────────
  (async () => {
    try {
      const res = await fetch('/health');
      const data = await res.json();
      if (data.status === 'ok') {
        statusDot.style.background = '#22d3a0';
        statusDot.title = `Sẵn sàng — ${data.chunk_count} chunks`;
      } else {
        statusDot.style.background = '#f87171';
        statusDot.title = 'DB chưa sẵn sàng';
      }
    } catch { statusDot.style.background = '#f87171'; }
  })();

  // ── Auto-resize textarea ──────────────────────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Suggestion buttons ────────────────────────────────────────────────────
  function sendSuggestion(btn) {
    inputEl.value = btn.textContent;
    sendMessage();
  }

  // ── Send message ──────────────────────────────────────────────────────────
  async function sendMessage() {
    const question = inputEl.value.trim();
    if (!question || isLoading) return;

    // Hide welcome
    document.getElementById('welcome')?.remove();

    // User bubble
    appendMessage('user', question);
    history.push({ role: 'user', content: question });

    inputEl.value = '';
    inputEl.style.height = 'auto';
    isLoading = true;
    sendBtn.disabled = true;

    // Typing indicator
    const typingRow = appendTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, history: history.slice(-12) }),
      });
      const data = await res.json();

      typingRow.remove();

      if (!res.ok) throw new Error(data.detail || 'Lỗi server');

      appendMessage('bot', data.answer, data.sources);
      history.push({ role: 'assistant', content: data.answer });

    } catch (err) {
      typingRow.remove();
      appendMessage('bot', `⚠️ ${err.message}`);
    } finally {
      isLoading = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // ── DOM helpers ───────────────────────────────────────────────────────────
  function appendMessage(role, text, sources = []) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '🧑' : '🤖';

    const right = document.createElement('div');

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatText(text);
    right.appendChild(bubble);

    // Sources
    if (sources.length) {
      const toggle = document.createElement('button');
      toggle.className = 'sources-toggle';
      toggle.innerHTML = `📚 ${sources.length} nguồn tham khảo ▾`;

      const panel = document.createElement('div');
      panel.className = 'sources-panel';

      sources.forEach(s => {
        const card = document.createElement('div');
        card.className = 'source-card';
        card.innerHTML = `
          <span class="page-badge">Trang ${s.page}</span>
          <div>${escHtml(s.excerpt)}</div>
          <div class="sim-bar"><div class="sim-fill" style="width:${s.similarity}%"></div></div>
          <div style="font-size:11px;margin-top:4px;color:#4f8ef7">${s.similarity}% liên quan</div>
        `;
        panel.appendChild(card);
      });

      toggle.addEventListener('click', () => {
        panel.classList.toggle('open');
        toggle.innerHTML = panel.classList.contains('open')
          ? `📚 ${sources.length} nguồn tham khảo ▴`
          : `📚 ${sources.length} nguồn tham khảo ▾`;
      });

      right.appendChild(toggle);
      right.appendChild(panel);
    }

    row.appendChild(avatar);
    row.appendChild(right);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
    return row;
  }

  function appendTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble" style="padding:14px 16px">
        <div class="typing"><span></span><span></span><span></span></div>
      </div>`;
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
    return row;
  }

  function formatText(text) {
    return escHtml(text)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
